<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="wu 凭据的加密存储方式：机器指纹派生密钥，AES-256-GCM 加密落盘">
  <style>
    /* The figure carries its own background so it stays legible no matter which theme the
       page is in — an SVG loaded through an img element cannot see the page CSS variables. */
    :root{
      --bg:#f7f8fa; --fg:#4b5563; --fg2:#6b7280; --strong:#111827; --line:#9ca3af;
      --panel:rgba(15,23,42,0.045); --panel2:rgba(15,23,42,0.02);
      --blue:#2563eb; --green:#059669; --amber:#d97706; --rose:#e11d48;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#1b1f24; --fg:#c3ccd8; --fg2:#98a3b3; --strong:#f1f5f9; --line:#6b7686;
             --panel:rgba(255,255,255,0.06); --panel2:rgba(255,255,255,0.03);
             --blue:#60a5fa; --green:#34d399; --amber:#fbbf24; --rose:#fb7185; }
    }
    .bg{ fill:var(--bg); }
    text{ font-family:"Segoe UI",-apple-system,system-ui,"Microsoft YaHei",sans-serif; fill:var(--fg); }
    .t-title{ font-size:15px; font-weight:700; fill:var(--strong); }
    .t-h{ font-size:12.5px; font-weight:600; fill:var(--strong); }
    .t-b{ font-size:11.5px; }
    .t-m{ font-size:11px; font-family:"Cascadia Code",Consolas,"SF Mono",monospace; fill:var(--fg2); }
    .t-tag{ font-size:10.5px; font-weight:700; letter-spacing:.06em; }
    .card{ fill:var(--panel); stroke:var(--line); stroke-width:1.1; }
    .card2{ fill:var(--panel2); stroke:var(--line); stroke-width:1; stroke-dasharray:4 3; }
    .arrow{ stroke:var(--line); stroke-width:1.6; fill:none; marker-end:url(#ah5); }
  </style>
  <defs>
    <marker id="ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="340"/>

  <text class="t-title" x="20" y="26">凭据的加密存储方式</text>

  <!-- 机器指纹 -->
  <rect class="card" x="20" y="52" width="250" height="126" rx="9"/>
  <rect x="20" y="52" width="4" height="126" rx="2" fill="var(--blue)"/>
  <text class="t-tag" x="38" y="74" fill="var(--blue)">机器指纹</text>
  <text class="t-m" x="38" y="98">hostname()</text>
  <text class="t-m" x="38" y="118">userInfo().username</text>
  <text class="t-m" x="38" y="138">platform()</text>
  <text class="t-b" x="38" y="164">三段以 \0 连接</text>

  <!-- KDF -->
  <rect class="card" x="300" y="52" width="230" height="126" rx="9"/>
  <rect x="300" y="52" width="4" height="126" rx="2" fill="var(--amber)"/>
  <text class="t-tag" x="318" y="74" fill="var(--amber)">派生密钥</text>
  <text class="t-m" x="318" y="98">scrypt(material, salt, 32)</text>
  <text class="t-b" x="318" y="122">salt 每次保存重新随机，</text>
  <text class="t-b" x="318" y="142">16 字节，以明文存于文件</text>
  <text class="t-b" x="318" y="164">密钥本身不落盘</text>

  <!-- 加密 -->
  <rect class="card" x="560" y="52" width="180" height="126" rx="9"/>
  <rect x="560" y="52" width="4" height="126" rx="2" fill="var(--green)"/>
  <text class="t-tag" x="578" y="74" fill="var(--green)">加密</text>
  <text class="t-m" x="578" y="98">aes-256-gcm</text>
  <text class="t-b" x="578" y="122">12 字节随机 IV</text>
  <text class="t-b" x="578" y="142">附带认证标签</text>
  <text class="t-b" x="578" y="164">任意改动即解密失败</text>

  <!-- 文件 -->
  <rect class="card" x="770" y="52" width="170" height="126" rx="9"/>
  <rect x="770" y="52" width="4" height="126" rx="2" fill="var(--rose)"/>
  <text class="t-tag" x="788" y="74" fill="var(--rose)">落盘</text>
  <text class="t-m" x="788" y="98">~/.wu/</text>
  <text class="t-m" x="788" y="116">credential.enc</text>
  <text class="t-b" x="788" y="140">JSON 字段：v / salt</text>
  <text class="t-b" x="788" y="158">/ iv / tag / data</text>

  <path class="arrow" d="M272,115 L296,115"/>
  <path class="arrow" d="M532,115 L556,115"/>
  <path class="arrow" d="M742,115 L766,115"/>

  <!-- 含义 -->
  <rect class="card2" x="20" y="206" width="450" height="112" rx="9"/>
  <text class="t-h" x="38" y="228">加密内容</text>
  <text class="t-m" x="38" y="252">tenantId · clientId · clientSecret · msContact</text>
  <text class="t-b" x="38" y="276">msContact 同样存于此处，不硬编码，也不写入 config.json。</text>
  <text class="t-b" x="38" y="296">首次运行时与凭据一并提问；--ms-contact 会更新已存储的值。</text>

  <rect class="card2" x="500" y="206" width="440" height="112" rx="9"/>
  <text class="t-h" x="518" y="228">跨机器不可用</text>
  <text class="t-b" x="518" y="252">主机名、用户名、平台任一项不一致，解密即失败。</text>
  <text class="t-b" x="518" y="272">失败被静默处理为「无凭据」，随后重新发起提问。</text>
  <text class="t-b" x="518" y="296">因此该文件复制到其他机器上不可用。</text>
</svg>
