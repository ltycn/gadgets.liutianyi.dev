<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="wu submit 的四个阶段：认证、选择提交、解析元数据、创建发布标签">
  <style>
    /* The figure carries its own background so it stays legible no matter which theme the
       page is in — an SVG loaded through an img element cannot see the page CSS variables. */
    :root{
      --bg:#f7f8fa; --fg:#4b5563; --fg2:#6b7280; --strong:#111827; --line:#9ca3af;
      --panel:rgba(15,23,42,0.045); --panel2:rgba(15,23,42,0.02);
      --blue:#2563eb; --green:#059669; --amber:#d97706; --purple:#9333ea; --rose:#e11d48;
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#1b1f24; --fg:#c3ccd8; --fg2:#98a3b3; --strong:#f1f5f9; --line:#6b7686;
             --panel:rgba(255,255,255,0.06); --panel2:rgba(255,255,255,0.03);
             --blue:#60a5fa; --green:#34d399; --amber:#fbbf24; --purple:#c084fc; --rose:#fb7185; }
    }
    .bg{ fill:var(--bg); }
    text{ font-family:"Segoe UI",-apple-system,system-ui,"Microsoft YaHei",sans-serif; fill:var(--fg); }
    .t-title{ font-size:15px; font-weight:700; fill:var(--strong); }
    .t-h{ font-size:12.5px; font-weight:600; fill:var(--strong); }
    .t-b{ font-size:11.5px; }
    .t-m{ font-size:11px; font-family:"Cascadia Code",Consolas,"SF Mono",monospace; fill:var(--fg2); }
    .t-tag{ font-size:10.5px; font-weight:700; letter-spacing:.06em; }
    .card{ fill:var(--panel); stroke:var(--line); stroke-width:1.1; }
    .card2{ fill:var(--panel2); stroke:var(--line); stroke-width:1; stroke-dasharray:4 3; }
    .arrow{ stroke:var(--line); stroke-width:1.6; fill:none; marker-end:url(#ah4); }
    .arrow-d{ stroke:var(--line); stroke-width:1.3; fill:none; stroke-dasharray:5 4; marker-end:url(#ah4); }
  </style>
  <defs>
    <marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="520"/>

  <text class="t-title" x="20" y="26">wu submit 的四个阶段</text>

  <!-- Step 1 -->
  <rect class="card" x="20" y="52" width="220" height="150" rx="9"/>
  <rect x="20" y="52" width="4" height="150" rx="2" fill="var(--blue)"/>
  <text class="t-tag" x="38" y="74" fill="var(--blue)">STEP 1 / 4</text>
  <text class="t-h" x="38" y="94">Initialize</text>
  <text class="t-b" x="38" y="116">读取 credential.enc，对缺失</text>
  <text class="t-b" x="38" y="134">项提问，结果加密写回</text>
  <text class="t-m" x="38" y="156">login.microsoftonline.com</text>
  <text class="t-m" x="38" y="174">/oauth2/token</text>
  <text class="t-b" x="38" y="194">获取 access_token</text>

  <!-- Step 2 -->
  <rect class="card" x="266" y="52" width="220" height="150" rx="9"/>
  <rect x="266" y="52" width="4" height="150" rx="2" fill="var(--amber)"/>
  <text class="t-tag" x="284" y="74" fill="var(--amber)">STEP 2 / 4</text>
  <text class="t-h" x="284" y="94">Submission Selection</text>
  <text class="t-b" x="284" y="116">需要 productId 与</text>
  <text class="t-b" x="284" y="134">submissionId。支持粘贴</text>
  <text class="t-b" x="284" y="152">链接自动解析出两个 ID</text>
  <text class="t-m" x="284" y="174">GET /products/{p}</text>
  <text class="t-m" x="284" y="192">    /submissions/{s}</text>

  <!-- Step 3 -->
  <rect class="card" x="512" y="52" width="220" height="150" rx="9"/>
  <rect x="512" y="52" width="4" height="150" rx="2" fill="var(--green)"/>
  <text class="t-tag" x="530" y="74" fill="var(--green)">STEP 3 / 4</text>
  <text class="t-h" x="530" y="94">Metadata &amp; Selection</text>
  <text class="t-b" x="530" y="116">从 submission 中定位</text>
  <text class="t-m" x="530" y="134">driverMetadata</text>
  <text class="t-b" x="530" y="154">下载后展开为候选列表，</text>
  <text class="t-b" x="530" y="172">通过多选界面选取目标</text>
  <text class="t-m" x="530" y="192">--select-all 全选</text>

  <!-- Step 4 -->
  <rect class="card" x="758" y="52" width="182" height="150" rx="9"/>
  <rect x="758" y="52" width="4" height="150" rx="2" fill="var(--purple)"/>
  <text class="t-tag" x="776" y="74" fill="var(--purple)">STEP 4 / 4</text>
  <text class="t-h" x="776" y="94">Create</text>
  <text class="t-b" x="776" y="116">补充标签名与 CHID，</text>
  <text class="t-b" x="776" y="134">构造请求体并写入</text>
  <text class="t-m" x="776" y="156">shippinglabel.</text>
  <text class="t-m" x="776" y="172">request.json</text>
  <text class="t-b" x="776" y="194">随后 POST 并返回链接</text>

  <path class="arrow" d="M242,127 L262,127"/>
  <path class="arrow" d="M488,127 L508,127"/>
  <path class="arrow" d="M734,127 L754,127"/>

  <!-- 候选列表展开 -->
  <rect class="card2" x="20" y="230" width="580" height="132" rx="9"/>
  <text class="t-h" x="38" y="252">候选列表的展开方式</text>
  <text class="t-m" x="38" y="276">BundleInfoMap ─ InfInfoMap ─ OSPnPInfoMap ─ PnpId</text>
  <text class="t-b" x="38" y="298">四层嵌套逐层展开，每个 (bundle, inf, os, pnp) 组合计为一个候选。</text>
  <text class="t-b" x="38" y="318">每个 bundle 分配 B1/B2/B3… 标签与一种颜色，用于区分候选来源。</text>
  <text class="t-b" x="38" y="338">候选超过 300 条时先询问是否按关键字过滤（匹配 INF / OS / PNP / 厂商 / 描述）。</text>
  <text class="t-m" x="38" y="356">--no-filter 跳过该步，--no-ui 改为编号输入</text>

  <path class="arrow-d" d="M600,127 L600,214 L310,214 L310,226"/>

  <!-- dry-run -->
  <rect class="card2" x="626" y="230" width="314" height="132" rx="9"/>
  <text class="t-h" x="644" y="252">--dry-run</text>
  <text class="t-b" x="644" y="276">正常构造并写入请求体，但不</text>
  <text class="t-b" x="644" y="296">执行 POST。适用于首次使用</text>
  <text class="t-b" x="644" y="316">以及 CI 中的参数自检。</text>
  <text class="t-m" x="644" y="340">--out 指定输出路径</text>

  <path class="arrow-d" d="M849,208 L849,226"/>

  <!-- 底部注意 -->
  <rect class="card" x="20" y="386" width="920" height="106" rx="9"/>
  <rect x="20" y="386" width="4" height="106" rx="2" fill="var(--rose)"/>
  <text class="t-h" x="38" y="410">注意事项</text>
  <text class="t-b" x="38" y="432">整个流程有 180 秒超时限制，网络延迟或在提示处停留过久会被中断，返回码 130。</text>
  <text class="t-b" x="38" y="452">CHID 为必填项且须为标准 GUID（8-4-4-4-12），格式错误会当场退回重新输入。</text>
  <text class="t-b" x="38" y="472">已存储的 tenant / client / secret 优先级高于命令行同名参数，更换需删除凭据文件。</text>
</svg>
